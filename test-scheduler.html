<!doctype html>
<meta charset="utf-8">
<title>scheduler.js test harness</title>
<pre id="out">running...</pre>
<!-- Plain classic scripts, not modules (see scheduler.js's header for why:
     file:// pages can't load ES modules at all). Opening this file directly
     works with no server. -->
<script src="data/catalog.js"></script>
<script src="data/commercials.js"></script>
<script src="data/cuts.js"></script>
<script src="channels.js"></script>
<script src="scheduler.js"></script>
<!-- Defines functions only, nothing runs at load — pulled in for
     programsBetween, the guide's timeline walk. -->
<script src="guide.js"></script>
<script>
const schedInternal = window.SCHEDULER_INTERNAL;
const lines = [];
let pass = 0, fail = 0;
function check(name, cond, detail) {
  if (cond) { pass++; lines.push(`PASS ${name}`); }
  else { fail++; lines.push(`FAIL ${name}${detail ? " — " + detail : ""}`); }
}

const byNumber = Object.fromEntries(CHANNELS.map((c) => [c.number, c]));

function main() {
  const catalog = window.CATALOG;

  // -- determinism ------------------------------------------------------
  const toon = byNumber[3]; // TOON CHANNEL / Animation
  const t0 = Date.now();
  const a = getPositionAt(toon, catalog, t0);
  const b = getPositionAt(toon, catalog, t0);
  check("determinism: same channel+time -> identical result",
    a && b && a.showId === b.showId && a.episode.key === b.episode.key && a.offsetSec === b.offsetSec,
    JSON.stringify({ a, b }));

  // -- offset is within the episode, or in the slot's pad after it ---------
  check("genre channel: offset within episode duration (or padding after it)",
    a && a.offsetSec >= 0 && (a.padding || a.offsetSec < playableSec(a.episode)),
    `offset=${a && a.offsetSec} playable=${a && playableSec(a.episode)} padding=${a && a.padding}`);

  // -- slot grid: every program start lands on a clean SLOT_SEC mark -------
  // The slot a position sits in ends at now + slotEndsInSec; that instant is
  // the next program's start, and it must land on the grid (every SLOT_SEC
  // minutes, not hardcoded to :00/:30 — see scheduler.js's own SLOT_SEC).
  const slotMinutes = SLOT_SEC / 60;
  let gridChecked = 0, gridOff = [];
  for (const c of CHANNELS) {
    // "vod" has no schedule either — getPositionAt returns null for it by
    // design (it's a browsable menu, see vod.js), so sweeping it counts a
    // deliberate null as a broken channel.
    if (c.kind === "guide" || c.kind === "vod") continue;
    for (const t of [t0, t0 + 3.7e6, t0 + 5 * 864e5 + 1234]) {
      const pos = getPositionAt(c, catalog, t);
      if (!pos) continue;
      gridChecked++;
      const boundary = new Date(Math.round(t + pos.slotEndsInSec * 1000));
      if (boundary.getMinutes() % slotMinutes !== 0 || boundary.getSeconds() !== 0) {
        gridOff.push(`ch${c.number} -> ${boundary.toTimeString().slice(0, 8)}`);
      }
    }
  }
  check(`all ${gridChecked} sampled slot boundaries land on a ${slotMinutes}-minute grid mark`,
    gridOff.length === 0, gridOff.slice(0, 5).join(", "));

  // -- the slot's last second: its final break, billing the next programme --
  // Unless the bill fills its slot to the second, the slot closes on a break
  // that isn't coming back to the programme, counting down to the next one.
  const billTotal = a.bill.reduce((sec, ep) => sec + playableSec(ep), 0);
  const fillsSlot = schedInternal.slotFor(billTotal) === billTotal;
  const lastSec = getPositionAt(toon, catalog, t0 + (a.slotEndsInSec - 1) * 1000);
  check("the last second of a slot is its final break, counting down to the next programme",
    fillsSlot || (lastSec.padding && lastSec.break.final && !lastSec.break.returning &&
      lastSec.slotEndsInSec > 0 && lastSec.slotEndsInSec <= 1.001 && lastSec.next && lastSec.next.episode),
    JSON.stringify({ billTotal, padding: lastSec.padding, left: lastSec.slotEndsInSec }));

  // -- breaks are spread through the programme, not stacked at the end ------
  // A single episode with at least four minutes of ads to carry must take
  // some of them inside the programme, and come back to itself afterwards.
  let spreadChecked = 0, spreadBad = [];
  for (const c of CHANNELS) {
    if (c.kind === "guide" || c.kind === "vod") continue;
    const start = getPositionAt(c, catalog, t0);
    if (!start || start.show.genre === "Broadcast Blocks" || start.bill.length !== 1) continue;
    const slotSec = start.slotOffsetSec + start.slotEndsInSec;
    if (slotSec - playableSec(start.episode) < 240 || playableSec(start.episode) < 900) continue;
    const slotStartMs = t0 - start.slotOffsetSec * 1000;
    const breaks = new Map();
    for (let s = 0.5; s < slotSec; s += 5) {
      const p = getPositionAt(c, catalog, slotStartMs + s * 1000);
      if (p.padding) breaks.set(p.break.index, p.break);
    }
    spreadChecked++;
    const inside = [...breaks.values()].filter((b) => !b.final);
    if (inside.length < 1 || inside.some((b) => !b.returning || b.returning.episode.key !== start.episode.key)) {
      spreadBad.push(`ch${c.number}: ${breaks.size} break(s), ${inside.length} inside`);
    }
  }
  check(`breaks fall inside the programme on all ${spreadChecked} channels airing one with 4+ minutes of ads`,
    spreadChecked > 0 && spreadBad.length === 0, spreadBad.slice(0, 5).join("; "));

  // -- genre pool covers every episode of every show in that genre --------
  const animationShows = Object.values(catalog.shows).filter((s) => s.genre === "Animation");
  const expectedEpisodeCount = animationShows.reduce((n, s) => n + s.episodes.length, 0);
  // walk the internal pool builder directly to check coverage without relying on timing
  const ids = animationShows.map((s) => s.id).sort();
  const info = schedInternal.buildPool(ids, catalog, "genre:Animation");
  // A pool entry is a bill — one slot's worth, which for shorts is several
  // episodes — so coverage is counted in episodes, not entries.
  const pooledEpisodes = info.pool.reduce((n, bill) => n + bill.eps.length, 0);
  check("genre pool includes every Animation episode exactly once",
    pooledEpisodes === expectedEpisodeCount &&
      new Set(info.pool.flatMap((bill) => bill.eps.map((e) => e.key))).size === expectedEpisodeCount,
    `pool=${pooledEpisodes} expected=${expectedEpisodeCount}`);
  check("shorts share a slot: no bill of several episodes runs past 25 minutes",
    info.pool.some((bill) => bill.eps.length > 1) &&
      info.pool.every((bill) => bill.eps.length === 1 || schedInternal.billSec(bill) <= 25 * 60),
    `shared bills=${info.pool.filter((bill) => bill.eps.length > 1).length}`);

  // -- reproducibility across process boundary (re-shuffle same seed) -----
  const reshuffled = schedInternal.shuffled([1, 2, 3, 4, 5], "seed-x");
  const reshuffled2 = schedInternal.shuffled([1, 2, 3, 4, 5], "seed-x");
  check("shuffle: same seed -> same order", JSON.stringify(reshuffled) === JSON.stringify(reshuffled2),
    JSON.stringify({ reshuffled, reshuffled2 }));

  // -- advancing time moves position forward (not stuck) -------------------
  // Past the *slot* boundary now, not just the episode's runtime — the pad
  // after a short episode still belongs to the same episode.
  const later = getPositionAt(toon, catalog, t0 + (a.slotEndsInSec + 5) * 1000);
  check("advancing past the slot boundary changes position",
    later && (later.showId !== a.showId || later.episode.key !== a.episode.key || later.offsetSec < a.offsetSec),
    JSON.stringify({ a, later }));

  // -- dayparted curated channel: Saturday morning window ------------------
  const satMorning = byNumber[14];
  const satTime = new Date(2026, 7, 15, 9, 0, 0).getTime(); // Sat 2026-08-15 09:00 local (August = month index 7)
  const satPos = getPositionAt(satMorning, catalog, satTime);
  check("Saturday 9am lands in the Saturday-morning pool",
    satPos && satMorning.daypart[0].pool.includes(satPos.showId),
    `showId=${satPos && satPos.showId}`);

  // -- dayparted curated channel: outside window uses fallback -------------
  const weekday = new Date(2026, 7, 10, 15, 0, 0).getTime(); // Mon 2026-08-10 15:00 local
  const fallbackPos = getPositionAt(satMorning, catalog, weekday);
  check("weekday afternoon uses the fallback pool, not the Saturday pool",
    fallbackPos && satMorning.fallbackPool.includes(fallbackPos.showId) &&
      !satMorning.daypart[0].pool.includes(fallbackPos.showId),
    `showId=${fallbackPos && fallbackPos.showId}`);

  // -- dayparting continuity: cumulative airtime keeps advancing week to week
  const satNext = new Date(2026, 7, 22, 9, 0, 0).getTime(); // following Saturday, same time-of-window
  const el1 = schedInternal.windowElapsedSec(satMorning.daypart[0], satTime);
  const el2 = schedInternal.windowElapsedSec(satMorning.daypart[0], satNext);
  const windowLenSec = (satMorning.daypart[0].endHour - satMorning.daypart[0].startHour) * 3600;
  check("cumulative window airtime advances by ~one window length across a week",
    Math.abs((el2 - el1) - windowLenSec) < 1,
    `el1=${el1} el2=${el2} windowLenSec=${windowLenSec}`);

  // -- commercial breaks ----------------------------------------------------
  // Walk each channel's current slot second by second, from its first mark:
  // every break must open at the top of a spot (the walk samples each second
  // on the second, so the first sample of a break is under a second into
  // it), no spot may still be running when its break ends, and no spot may
  // air twice in the slot.
  let breaksChecked = 0;
  const breakProblems = [];
  for (const c of CHANNELS) {
    // "vod" has no schedule either — getPositionAt returns null for it by
    // design (it's a browsable menu, see vod.js), so sweeping it counts a
    // deliberate null as a broken channel.
    if (c.kind === "guide" || c.kind === "vod") continue;
    const start = getPositionAt(c, catalog, t0);
    if (!start) continue;
    const slotStartMs = t0 - start.slotOffsetSec * 1000;
    const slotSec = Math.round(start.slotOffsetSec + start.slotEndsInSec);
    let lastBreak = -1, lateJoins = 0, overruns = 0, repeats = 0;
    const aired = [];
    for (let s = 0; s < slotSec; s++) {
      const pos = getPositionAt(c, catalog, slotStartMs + s * 1000);
      if (!pos || !pos.padding) continue;
      const b = pos.break;
      if (b.index !== lastBreak) {
        lastBreak = b.index;
        breaksChecked++;
        if (b.spot && b.spotOffsetSec > 1.5) lateJoins++;
      }
      if (!b.spot) continue; // leftover sliver: countdown card, no spot fits
      if (b.spot.durationSec - b.spotOffsetSec > b.endsInSec + 0.001) overruns++;
      if (aired[aired.length - 1] !== b.spot.key) {
        if (aired.includes(b.spot.key)) repeats++;
        aired.push(b.spot.key);
      }
    }
    if (lateJoins || overruns || repeats) {
      breakProblems.push(`ch${c.number} lateJoins=${lateJoins} overruns=${overruns} repeats=${repeats}`);
    }
  }
  check(`${breaksChecked} commercial breaks start at the top of a spot, never overrun, never repeat a spot in a slot`,
    breaksChecked > 0 && breakProblems.length === 0, breakProblems.slice(0, 5).join("; "));

  // Not "shorter than a slot" — a spot only has to fit the break it's put in
  // (the break plan enforces that), and the long-form infomercials can run
  // well past a short break (they exist to cover unusually long final
  // breaks). This just checks the pool matches build-commercials.py's own
  // MAX_SEC bound.
  check("commercials are loaded and within the configured duration bound",
    schedInternal.adSpots().length > 0 &&
      schedInternal.adSpots().every((s) => s.durationSec > 0 && s.durationSec < 1800),
    `spots=${schedInternal.adSpots().length}`);

  // -- every channel in the lineup resolves to a valid position ------------
  const sampleTimes = [
    new Date(2026, 7, 10, 9, 0, 0).getTime(),   // Mon
    new Date(2026, 7, 14, 21, 30, 0).getTime(), // Fri night
    new Date(2026, 7, 15, 23, 30, 0).getTime(), // Sat late
    new Date(2026, 7, 16, 3, 0, 0).getTime(),   // Sun small hours
  ];
  let channelsChecked = 0, sweepFailures = 0;
  for (const c of CHANNELS) {
    // "vod" has no schedule either — getPositionAt returns null for it by
    // design (it's a browsable menu, see vod.js), so sweeping it counts a
    // deliberate null as a broken channel.
    if (c.kind === "guide" || c.kind === "vod") continue;
    channelsChecked++;
    for (const t of sampleTimes) {
      const pos = getPositionAt(c, catalog, t);
      const ok = pos && pos.offsetSec >= 0 && catalog.shows[pos.showId] &&
        (pos.padding || pos.offsetSec < pos.episode.durationSec);
      if (!ok) {
        sweepFailures++;
        lines.push(`  detail: channel ${c.number} (${c.name}) at ${new Date(t)} — ${JSON.stringify(pos)}`);
      }
    }
  }
  check(`all ${channelsChecked} non-guide channels resolve a valid position at 4 sample times`,
    sweepFailures === 0, `${sweepFailures} bad result(s)`);

  // -- broken files are substituted, without moving the grid ---------------
  // Run last: markBroken mutates a session-wide registry, so anything after
  // this would be reasoning about a doctored schedule.
  const victimCh = byNumber[3];
  const before = getPositionAt(victimCh, catalog, t0);
  markBroken(before.episode.key);
  const after = getPositionAt(victimCh, catalog, t0);
  check("a broken episode is replaced by a different one",
    after && after.episode.key !== before.episode.key,
    `before=${before.episode.key} after=${after && after.episode.key}`);
  check("substituting does not move the slot boundary",
    after && Math.abs(after.slotEndsInSec - before.slotEndsInSec) < 1e-9,
    `before=${before.slotEndsInSec} after=${after && after.slotEndsInSec}`);
  const boundaryAfter = new Date(Math.round(t0 + after.slotEndsInSec * 1000));
  check(`the substituted slot still ends on a ${slotMinutes}-minute grid mark`,
    boundaryAfter.getMinutes() % slotMinutes === 0 && boundaryAfter.getSeconds() === 0,
    boundaryAfter.toTimeString().slice(0, 8));

  // Every file in a pool dead: nothing to substitute, so the caller gets the
  // broken entry back and the player can fall through to NO SIGNAL.
  const tinyCatalog = { shows: { t: { id: "t", genre: "T", episodes: [
    { key: "t1", itemId: "i", fileHint: "a.mp4", durationSec: 600 },
    { key: "t2", itemId: "i", fileHint: "b.mp4", durationSec: 600 },
  ] } } };
  const tinyPool = schedInternal.buildPool(["t"], tinyCatalog, "tiny");
  schedInternal.brokenKeys.add("t1");
  schedInternal.brokenKeys.add("t2");
  const exhausted = schedInternal.locate(tinyPool, 5);
  check("an all-broken pool returns a broken entry rather than looping forever",
    exhausted && schedInternal.brokenKeys.has(exhausted.episode.key),
    JSON.stringify(exhausted && exhausted.episode.key));

  // -- ordered pools: serials play front-to-back, then loop ----------------
  // A shuffled pool is the default; `ordered` keeps catalog order so a serial
  // (Dark Shadows) runs 1 -> last -> 1 rather than scattering its chapters.
  const serialCatalog = { shows: { s: { id: "s", genre: "S", episodes:
    Array.from({ length: 8 }, (_, i) => (
      { key: `s${i}`, itemId: "i", fileHint: `${i}.mp4`, durationSec: 1500 })) } } };
  const inOrder = schedInternal.buildPool(["s"], serialCatalog, "seed", { ordered: true });
  const poolKeys = (info) => info.pool.flatMap((bill) => bill.eps.map((e) => e.key)).join();
  check("ordered pool keeps catalog order",
    poolKeys(inOrder) === "s0,s1,s2,s3,s4,s5,s6,s7", poolKeys(inOrder));
  // One slot past the last episode must wrap to the first, not stall or repeat.
  const lastStart = inOrder.cumulative[inOrder.pool.length - 1];
  check("ordered pool wraps from the last episode back to the first",
    schedInternal.locate(inOrder, lastStart).episode.key === "s7" &&
    schedInternal.locate(inOrder, inOrder.totalSec).episode.key === "s0",
    JSON.stringify({ last: schedInternal.locate(inOrder, lastStart).episode.key,
                     wrapped: schedInternal.locate(inOrder, inOrder.totalSec).episode.key }));
  check("without `ordered` the same pool is shuffled",
    poolKeys(schedInternal.buildPool(["s"], serialCatalog, "seed")) !== "s0,s1,s2,s3,s4,s5,s6,s7");

  // -- guide timeline ------------------------------------------------------
  // programsBetween (guide.js) walks the same schedule to find the boundaries
  // the guide draws its vertical lines at. Two properties matter: the blocks
  // must tile the window with no gaps or overlaps (every instant belongs to
  // exactly one programme, same as the picture), and any block drawn with a
  // solid start line must really be a start — tuning in one second later must
  // land at the top of that programme, not partway through it. Blocks that
  // pick up mid-programme (daypart pool switches) must be flagged `joined`
  // instead, which is what makes their line dotted.
  const HALF_HOUR = 30 * 60 * 1000;
  const windowStart = EPOCH_MS + Math.floor((t0 - EPOCH_MS) / HALF_HOUR) * HALF_HOUR;
  const windowEnd = windowStart + 3 * HALF_HOUR;
  let tiled = 0, blockCount = 0, tileBad = [];
  for (const c of CHANNELS) {
    // "vod" has no schedule either — getPositionAt returns null for it by
    // design (it's a browsable menu, see vod.js), so sweeping it counts a
    // deliberate null as a broken channel.
    if (c.kind === "guide" || c.kind === "vod") continue;
    const blocks = programsBetween(catalog, c, windowStart, windowEnd);
    if (blocks.length === 0) { tileBad.push(`ch${c.number}: no blocks`); continue; }
    tiled++;
    blockCount += blocks.length;
    if (blocks[0].airsFrom !== windowStart) tileBad.push(`ch${c.number}: does not start at the window`);
    if (blocks[blocks.length - 1].airsUntil < windowEnd) tileBad.push(`ch${c.number}: ends early`);
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b.airsUntil <= b.airsFrom) tileBad.push(`ch${c.number}: block ${i} is empty`);
      if (i > 0 && b.airsFrom !== blocks[i - 1].airsUntil) {
        tileBad.push(`ch${c.number}: gap/overlap at block ${i}`);
      }
      const justAfter = getPositionAt(c, catalog, b.airsFrom + 1000);
      const reallyStarts = justAfter && justAfter.slotOffsetSec <= 2;
      if (!b.joined && !reallyStarts) {
        tileBad.push(`ch${c.number}: block ${i} drawn as a start but isn't (offset=${justAfter && justAfter.slotOffsetSec})`);
      }
      if (b.joined && reallyStarts && i > 0) {
        tileBad.push(`ch${c.number}: block ${i} flagged joined but is a real start`);
      }
    }
  }
  check(`guide timeline: ${blockCount} blocks across ${tiled} channels tile the window, start lines are real starts`,
    tileBad.length === 0, tileBad.slice(0, 5).join(", "));

  // -- channel pools reference real shows ----------------------------------
  // buildPool only console.warns on an unknown show id, so a typo in a
  // hand-written pool silently shrinks that channel instead of failing. These
  // are typed by hand, so check them.
  let poolRefs = 0, unknownRefs = [], emptyChannels = [];
  for (const c of CHANNELS) {
    // "vod" has no schedule either — getPositionAt returns null for it by
    // design (it's a browsable menu, see vod.js), so sweeping it counts a
    // deliberate null as a broken channel.
    if (c.kind === "guide" || c.kind === "vod") continue;
    const ids = [...(c.fallbackPool || []), ...(c.daypart || []).flatMap((w) => w.pool || []),
                 ...(c.excludeShowIds || [])];
    for (const id of ids) {
      poolRefs++;
      if (!catalog.shows[id]) unknownRefs.push(`ch${c.number} -> ${id}`);
    }
    if (c.kind === "curated" && (c.fallbackPool || []).length === 0) emptyChannels.push(`ch${c.number}`);
  }
  check(`all ${poolRefs} channel pool references name a show in the catalog`,
    unknownRefs.length === 0, unknownRefs.slice(0, 8).join(", "));
  // Every curated channel needs a fallback: with none, it goes dead the moment
  // it falls outside its daypart windows.
  check("every curated channel has a non-empty fallbackPool",
    emptyChannels.length === 0, emptyChannels.join(", "));

  // -- intro skip ----------------------------------------------------------
  // For a rip with baked-in intro footage, slot time maps onto content time:
  // offset 0 is the first real frame, and the seek advances one-for-one with
  // the clock without ever running off the end of the file. (The old
  // max(offset, skip) form pinned the seek at `skip` for the first `skip`
  // seconds while playback ran past it, so the drift check kept snapping the
  // picture back — this walk fails if that ever returns.)
  const seekFor = (ep, offsetSec) => offsetSec + (ep.introSkipSec || 0); // mirrors player.js
  const skipShows = Object.values(catalog.shows)
    .filter((s) => s.episodes.some((e) => (e.introSkipSec || 0) > 0));
  let skipEps = 0, skipBad = [];
  for (const s of skipShows) {
    for (const ep of s.episodes) {
      if (!(ep.introSkipSec > 0)) continue;
      skipEps++;
      const playable = playableSec(ep);
      if (playable + ep.introSkipSec !== ep.durationSec) skipBad.push(`${s.id}: playable mismatch`);
      if (seekFor(ep, 0) !== ep.introSkipSec) skipBad.push(`${s.id}: offset 0 is not the content start`);
      let prev = -1;
      for (let o = 0; o < playable; o += Math.max(1, Math.floor(playable / 20))) {
        const seek = seekFor(ep, o);
        if (seek <= prev) skipBad.push(`${s.id}: seek not advancing at offset ${o}`);
        if (seek >= ep.durationSec) skipBad.push(`${s.id}: seek ${seek} past end ${ep.durationSec}`);
        prev = seek;
      }
    }
  }
  check(`intro skip: ${skipEps} episodes across ${skipShows.length} shows map slot time onto content time`,
    skipEps > 0 && skipBad.length === 0,
    skipEps === 0 ? "no episodes with introSkipSec — expected Hitchcock/Twilight Zone" : skipBad.slice(0, 5).join(", "));

  // -- seek-index warmer: the set it has to keep warm stays small -----------
  // player.js warms the index of every currently-airing item over 3h, one per
  // 15s tick. That only works because the set is small — the viewer can only
  // tune to what's airing now. If a schedule or threshold change ever put
  // dozens of long items on air at once, the warmer would thrash and steal
  // bandwidth from the picture, so pin the bound here rather than find out.
  const WARM_OVER_SEC = 3 * 3600; // mirrors player.js
  let worstWarmSet = 0, warmSamples = 0;
  const longItems = new Set();
  for (let m = 0; m < 24 * 60; m += 15) {
    const at = t0 + m * 60 * 1000;
    let n = 0;
    for (const c of CHANNELS) {
      // "vod" has no schedule either — getPositionAt returns null for it by
    // design (it's a browsable menu, see vod.js), so sweeping it counts a
    // deliberate null as a broken channel.
    if (c.kind === "guide" || c.kind === "vod") continue;
      const p = getPositionAt(c, catalog, at);
      if (p && p.episode.durationSec > WARM_OVER_SEC) { n++; longItems.add(p.episode.key); }
    }
    worstWarmSet = Math.max(worstWarmSet, n);
    warmSamples++;
  }
  check(`warmer: at most ${worstWarmSet} channels air a >3h item at once (${longItems.size} distinct over 24h)`,
    worstWarmSet <= 8, `${worstWarmSet} simultaneous across ${warmSamples} samples — warmer would thrash`);

  // -- dead archive.org items stay pruned ----------------------------------
  // These return {"error"} from archive.org/metadata. tools/build-catalog.py
  // drops them via DEAD_ITEMS; this fails if a rebuild ever lets them back in.
  const deadItems = ["myopic-vhs-no-08", "stephen-kings-the-langoliers-1995-hd"];
  const resurrected = Object.values(catalog.shows)
    .flatMap((s) => s.episodes)
    .filter((e) => deadItems.includes(e.itemId))
    .map((e) => e.itemId);
  check("no episode references a known-dead archive.org item",
    resurrected.length === 0, resurrected.join(", "));

  document.getElementById("out").textContent =
    lines.join("\n") + `\n\n${pass} passed, ${fail} failed`;
  document.title = fail === 0 ? "ALL PASS" : `${fail} FAILED`;
}

try {
  main();
} catch (e) {
  document.getElementById("out").textContent = "ERROR: " + (e && e.stack || e);
  document.title = "ERROR";
}
</script>
