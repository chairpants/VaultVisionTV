<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultVisionTV</title>
<link rel="stylesheet" href="style.css">

<div id="tv">
  <video id="screen" playsinline></video>
  <!-- Outlines the docked picture while the guide is up. A sibling of the
       video rather than a border on it, because the video carries the crop
       transform and a border would be scaled and shifted along with it —
       player.js's layoutCrop() sizes this to the exact picture rect. -->
  <div id="guide-video-frame" class="hidden"></div>

  <!-- Same "readout" z-index tier as #osd/#digit-osd/#chyron below (see
       style.css's stacking-order comment), so it's covered by the guide/VOD
       overlays same as those — no need to hide it by hand for those states,
       or to dodge the docked picture-in-picture box that lands in this same
       corner while the guide is up. -->
  <button id="fullscreen-btn" type="button" aria-label="Enter fullscreen" aria-pressed="false">
    <svg class="icon-expand" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </svg>
    <svg class="icon-compress" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
    </svg>
  </button>

  <div id="osd" class="hidden">
    <div id="osd-ch"></div>
    <div id="osd-tagline"></div>
    <div id="osd-show"></div>
    <div id="osd-episode"></div>
    <div id="osd-bar"><div id="osd-bar-fill"></div></div>
  </div>

  <div id="digit-osd" class="hidden"></div>

  <!-- Shown during a break only when no commercial fits the time left (the
       leftover sliver at the end of a slot, or no spots loaded at all). -->
  <div id="pad-card" class="hidden">STAND BY</div>

  <!-- Lower third during a commercial break: what's coming back on and how
       long until it does. The video shrinks to sit above it (layoutCrop). -->
  <div id="chyron" class="hidden">
    <span id="chyron-label">UP NEXT</span>
    <span id="chyron-title"></span>
    <span id="chyron-sub"></span>
    <span id="chyron-clock"></span>
  </div>

  <div id="guide" class="hidden"></div>

  <!-- Video On Demand: a browsable menu, not a scheduled channel, so unlike
       the guide it takes over the whole screen the same way any other
       channel does (see app.js's enterVod) rather than docking the live
       picture in a corner. Populated by vod.js's createVod(). -->
  <div id="vod" class="hidden"></div>

  <!-- Hold-to-scrub UI, VOD playback only — player.js's vodSeekBegin/
       vodSeekCommit own it directly (it's lower-level than a vod.js
       concern: scrubbing happens while the browse overlay above is
       hidden). -->
  <div id="vod-seek" class="hidden">
    <div id="vod-seek-dir"></div>
    <div id="vod-seek-bar"><div id="vod-seek-fill"></div></div>
    <div id="vod-seek-time"></div>
  </div>

  <div id="blank-msg" class="hidden">NO SIGNAL</div>
  <div id="start-hint" class="hidden">CLICK OR PRESS ANY KEY TO START</div>
</div>

<!-- Sits mostly off the bottom edge; only #remote-head shows until you
     mouse over it (CSS :hover, see style.css), or on touch devices (no
     hover) tap #remote-toggle — its chevron flips to point the other way
     while open, see remote.js's toggleOpen(). -->
<div id="remote">
  <div id="remote-head">
    <span>VAULTVISION</span>
    <button id="remote-toggle" type="button" aria-label="Show remote controls" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15l8-8 8 8"/></svg>
    </button>
  </div>

  <div class="rockers">
    <div class="rocker">
      <button data-action="ch-up">CH &plus;</button>
      <button data-action="ch-down">CH &minus;</button>
    </div>
    <div class="rocker">
      <button data-action="vol-up">VOL &plus;</button>
      <button data-action="vol-down">VOL &minus;</button>
    </div>
  </div>

  <div class="remote-row">
    <button data-action="guide" class="fn-guide">GUIDE</button>
    <button data-action="vod" class="fn-vod">VOD</button>
  </div>
  <div class="remote-row">
    <button data-action="last" class="fn-last">RETURN</button>
    <button data-action="mute" class="fn-mute">MUTE</button>
  </div>

  <div class="keypad">
    <button data-digit="1">1</button>
    <button data-digit="2">2</button>
    <button data-digit="3">3</button>
    <button data-digit="4">4</button>
    <button data-digit="5">5</button>
    <button data-digit="6">6</button>
    <button data-digit="7">7</button>
    <button data-digit="8">8</button>
    <button data-digit="9">9</button>
    <button data-digit="0" class="key-zero">0</button>
    <button data-action="web" class="key-web" title="Open on archive.org" aria-label="Open on archive.org">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <ellipse cx="12" cy="12" rx="4.2" ry="9"/>
        <path d="M3 12h18M5.1 6.4h13.8M5.1 17.6h13.8"/>
      </svg>
    </button>
    <button data-action="enter" class="key-enter">ENTER</button>
  </div>
</div>

<!-- Plain classic scripts, not modules — Chrome refuses to load ES modules
     over file://, full stop, no header can fix it. Loading order matters:
     each file assigns onto the shared top-level scope / window for the next
     one to use, same trick VaultVision itself uses for shows.js/data.js. -->
<script src="data/catalog.js"></script>
<script src="data/commercials.js"></script>
<script src="channels.js"></script>
<script src="scheduler.js"></script>
<script src="player.js"></script>
<script src="remote.js"></script>
<script src="guide.js"></script>
<script src="vod.js"></script>
<script src="app.js"></script>
